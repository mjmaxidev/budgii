name: budgii

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env.backend
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-budgii} -d $${POSTGRES_DB:-budgii}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./budgii-api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.backend
    ports:
      - "8001:8000"
    volumes:
      - receipt_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy

  recurring-worker:
    build:
      context: ./budgii-api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.backend
    command: ["python", "scripts/run_scheduler.py", "recurring", "--interval-seconds", "3600"]
    depends_on:
      api:
        condition: service_healthy

  push-worker:
    build:
      context: ./budgii-api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.backend
    command: ["python", "scripts/run_scheduler.py", "push", "--interval-seconds", "300"]
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  receipt_uploads:
