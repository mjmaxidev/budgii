name: budgii-staging

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env.backend
    volumes:
      - server_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-budgii} -d ${POSTGRES_DB:-budgii}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ./budgii-api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${SERVER_API_PORT:-18087}:8000"
    env_file:
      - .env.backend
    volumes:
      - server_receipt_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_ENABLED: "true"
        VITE_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:18087/v1}
        VITE_SHOW_DEMO_TOOLS: ${VITE_SHOW_DEMO_TOOLS:-false}
    restart: unless-stopped
    ports:
      - "${SERVER_FRONTEND_PORT:-18088}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  recurring-worker:
    build:
      context: ./budgii-api
      dockerfile: Dockerfile
    restart: unless-stopped
    command:
      [
        "python",
        "scripts/run_scheduler.py",
        "recurring",
        "--interval-seconds",
        "${RECURRING_WORKER_INTERVAL_SECONDS:-3600}",
      ]
    env_file:
      - .env.backend
    depends_on:
      api:
        condition: service_healthy

  push-worker:
    build:
      context: ./budgii-api
      dockerfile: Dockerfile
    restart: unless-stopped
    command:
      [
        "python",
        "scripts/run_scheduler.py",
        "push",
        "--interval-seconds",
        "${PUSH_WORKER_INTERVAL_SECONDS:-300}",
      ]
    env_file:
      - .env.backend
    depends_on:
      api:
        condition: service_healthy

volumes:
  server_postgres_data:
  server_receipt_uploads:
