services:
  db:
    # Keep Postgres reachable to the API on the Docker network, but do not
    # publish 5432 on the host. This avoids conflicts with an existing local
    # Postgres container while preserving the base compose file for clean setups.
    ports: !reset []

  api:
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      API_PREFIX: /v1
      DATABASE_URL: postgresql+asyncpg://budgii:budgii@db:5432/budgii
      JWT_SECRET: dev-docker-secret-change-me
      INVITE_LINK_BASE: https://budgii.app/join
      RECEIPT_STORAGE_PATH: /app/uploads
