<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Budgii Interactive UX Map</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; overflow: hidden; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f172a;
  }

  /* Header */
  #header {
    position: fixed; top: 0; left: 0; right: 0; height: 72px;
    background: rgba(255,255,255,0.96); backdrop-filter: blur(10px);
    border-bottom: 1px solid #e5e7eb;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px; z-index: 1000;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  #header h1 {
    font-size: 22px; font-weight: 800;
    background: linear-gradient(135deg,#1a3b2e,#ff6a00);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .header-right { display: flex; align-items: center; gap: 10px; }
  #search {
    width: 260px; padding: 10px 14px; border: 2px solid #e5e7eb;
    border-radius: 10px; font-size: 14px; outline: none; transition: .2s;
  }
  #search:focus { border-color: #ff6a00; box-shadow: 0 0 0 4px rgba(255,106,0,.12); }
  .btn {
    padding: 9px 14px; background: #fff; border: 1px solid #e5e7eb;
    border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 600;
    color: #1a3b2e; transition: .2s; white-space: nowrap;
  }
  .btn:hover { background:#ff6a00; color:#fff; border-color:#ff6a00; }

  /* Viewport / world */
  #viewport {
    position: fixed; inset: 72px 0 0 0; overflow: hidden;
    background:
      radial-gradient(circle at 20% 20%, rgba(255,106,0,.06), transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(2,132,199,.06), transparent 40%),
      #0f172a;
    cursor: grab;
  }
  #viewport.grabbing { cursor: grabbing; }
  #world { position: absolute; top: 0; left: 0; transform-origin: 0 0; }

  svg#edges { position: absolute; top: 0; left: 0; overflow: visible; pointer-events: none; }

  /* Cards */
  .card {
    position: absolute; width: 188px;
    background: #fff; border-radius: 18px; overflow: hidden;
    border: 3px solid var(--c);
    box-shadow: 0 8px 24px rgba(0,0,0,.35);
    cursor: pointer; transition: transform .15s, box-shadow .15s;
  }
  .card:hover { transform: translateY(-4px); box-shadow: 0 16px 40px rgba(0,0,0,.5); z-index: 5; }
  .card.dim { opacity: .15; }
  .card.focus { box-shadow: 0 0 0 4px var(--c), 0 16px 40px rgba(0,0,0,.5); z-index: 6; }
  .card-bar {
    display: flex; align-items: center; gap: 7px;
    padding: 8px 10px; font-size: 12.5px; font-weight: 700; color: #fff;
    background: var(--c);
  }
  .card-bar .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.85); }
  .card-shot {
    width: 100%; display: block; aspect-ratio: 390 / 844;
    object-fit: cover; object-position: top center; background: #fff5ea;
  }

  /* Modal */
  #modal {
    position: fixed; inset: 0; background: rgba(0,0,0,.75); backdrop-filter: blur(3px);
    display: none; align-items: center; justify-content: center; z-index: 2000; padding: 24px;
  }
  #modal.show { display: flex; }
  .modal-card {
    background: #fff; border-radius: 18px; width: min(840px, 95vw);
    max-height: 92vh; overflow: hidden; display: grid; grid-template-columns: 360px 1fr;
    box-shadow: 0 30px 80px rgba(0,0,0,.5);
  }
  .modal-shot { background: #fff5ea; display: flex; align-items: center; justify-content: center; padding: 18px; }
  .modal-shot img { width: 100%; border-radius: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
  .modal-body { padding: 26px 28px; overflow-y: auto; }
  .modal-body h2 { font-size: 24px; color: #111827; margin-bottom: 4px; }
  .modal-cat { display:inline-block; font-size:12px; font-weight:700; color:#fff; padding:4px 10px; border-radius:999px; background: var(--c); margin-bottom: 18px; }
  .modal-route { font-family: ui-monospace, monospace; font-size: 13px; color:#6b7280; background:#f9fafb; padding:8px 12px; border-radius:8px; margin-bottom: 22px; }
  .grp-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color:#9ca3af; margin: 18px 0 8px; }
  .conn { display:flex; align-items:center; gap:8px; padding:9px 12px; border-radius:10px; background:#f9fafb; margin-bottom:7px; font-size:14px; color:#111827; font-weight:600; cursor:pointer; transition:.15s; }
  .conn:hover { background: var(--c); color:#fff; }
  .conn .arrow { opacity:.6; }
  .conn.in .arrow { transform: scaleX(-1); }
  .close-x { position:absolute; top:18px; right:22px; font-size:26px; color:#fff; cursor:pointer; z-index:2001; line-height:1; }

  /* Legend */
  #legend {
    position: fixed; bottom: 20px; left: 20px; z-index: 100;
    background: rgba(255,255,255,.96); backdrop-filter: blur(10px);
    border-radius: 12px; padding: 16px 18px; box-shadow: 0 4px 16px rgba(0,0,0,.2);
  }
  #legend h3 { font-size: 13px; color:#1a3b2e; margin-bottom: 10px; }
  .leg { display:flex; align-items:center; gap:8px; font-size:12.5px; color:#475569; margin-bottom:6px; }
  .leg span { width:14px; height:14px; border-radius:4px; }

  #hint {
    position: fixed; bottom: 20px; right: 20px; z-index: 100;
    background: rgba(255,255,255,.9); border-radius: 10px; padding: 10px 14px;
    font-size: 12px; color:#64748b;
  }
</style>
</head>
<body>
  <div id="header">
    <h1>🗺️ Budgii Interactive UX Map</h1>
    <div class="header-right">
      <input id="search" placeholder="Search screens…">
      <button class="btn" onclick="fitAll()">Fit</button>
      <button class="btn" onclick="resetView()">Reset</button>
    </div>
  </div>

  <div id="viewport">
    <div id="world">
      <svg id="edges"></svg>
    </div>
  </div>

  <div id="legend"><h3>Categories</h3></div>
  <div id="hint">Drag to pan · Scroll to zoom · Click a screen</div>

  <div id="modal">
    <div class="close-x" onclick="closeModal()">✕</div>
    <div class="modal-card" id="modalCard">
      <div class="modal-shot"><img id="modalImg" src="" alt=""></div>
      <div class="modal-body">
        <h2 id="modalTitle"></h2>
        <span class="modal-cat" id="modalCat"></span>
        <div class="modal-route" id="modalRoute"></div>
        <div id="modalOut"></div>
        <div id="modalIn"></div>
      </div>
    </div>
  </div>

<script>
  const CATS = {
    Auth:      { color: '#FF6A00', label: 'Auth & Onboarding' },
    Hub:       { color: '#1A3B2E', label: 'Home Hub' },
    Expenses:  { color: '#16A34A', label: 'Expense Tracking' },
    Analytics: { color: '#0284C7', label: 'Reports & Analytics' },
    Budget:    { color: '#0891B2', label: 'Budget' },
    Deals:     { color: '#DC2626', label: 'Deals & Shopping' },
    User:      { color: '#7C3AED', label: 'Settings & User' },
    Support:   { color: '#6B7280', label: 'Support' },
  };

  // name, category, route, grid col, grid row
  const PAGES = {
    Login:             { cat:'Auth',      route:'#/login',              col:0, row:0 },
    Verification:      { cat:'Auth',      route:'#/verification',       col:1, row:0 },
    OnBoarding:        { cat:'Auth',      route:'#/onboarding',         col:2, row:0 },
    Home:             { cat:'Hub',       route:'#/home',               col:3, row:0 },
    Notifications:     { cat:'User',      route:'#/notifications',      col:4, row:0 },

    Transactions:      { cat:'Expenses',  route:'#/transactions',       col:2, row:1 },
    SpendingBreakdown: { cat:'Analytics', route:'#/spending-breakdown', col:3, row:1 },
    DealWatchlist:     { cat:'Deals',     route:'#/deal-watchlist',     col:4, row:1 },

    AddExpense:        { cat:'Expenses',  route:'#/add-expense',        col:1, row:2 },
    ScanReceipt:       { cat:'Expenses',  route:'#/scan-receipt',       col:2, row:2 },
    Reports:           { cat:'Analytics', route:'#/reports',            col:3, row:2 },
    DealCards:         { cat:'Deals',     route:'#/deal-cards',         col:4, row:2 },

    BudgetSetup:       { cat:'Budget',    route:'#/budget-setup',       col:3, row:3 },
    BudgetComparison:  { cat:'Analytics', route:'#/budget-comparison',  col:2, row:3 },
    CategoriesTags:    { cat:'Budget',    route:'#/categories-tags',    col:1, row:3 },
    ShoppingList:      { cat:'Deals',     route:'#/shopping-list',      col:4, row:3 },

    Profile:           { cat:'User',      route:'#/profile',            col:0, row:4 },
    Settings:          { cat:'User',      route:'#/settings',           col:1, row:4 },
    FamilyMembers:     { cat:'User',      route:'#/family-members',     col:2, row:4 },
    Help:              { cat:'Support',   route:'#/help',               col:0, row:2 },
  };

  const EDGES = [
    ['Login','Verification'],['Verification','OnBoarding'],['OnBoarding','Home'],
    ['Home','Transactions'],['Home','SpendingBreakdown'],['Home','DealWatchlist'],['Home','Notifications'],
    ['Transactions','AddExpense'],['Transactions','ScanReceipt'],
    ['AddExpense','Home'],['ScanReceipt','Home'],
    ['Reports','BudgetSetup'],['Reports','SpendingBreakdown'],['SpendingBreakdown','Transactions'],
    ['DealWatchlist','DealCards'],['DealCards','ShoppingList'],['ShoppingList','DealWatchlist'],
    ['BudgetSetup','Reports'],
    ['Profile','Login'],['Settings','Login'],['FamilyMembers','Settings'],
    ['CategoriesTags','BudgetSetup'],
  ];

  const CARD_W = 188, CARD_H = 250;      // approx card height for layout
  const GAP_X = 150, GAP_Y = 150;
  const CELL_W = CARD_W + GAP_X, CELL_H = CARD_H + GAP_Y;
  const PAD = 80;

  const world = document.getElementById('world');
  const svg = document.getElementById('edges');
  const viewport = document.getElementById('viewport');

  // place cards
  const pos = {};
  Object.entries(PAGES).forEach(([name, p]) => {
    const x = PAD + p.col * CELL_W;
    const y = PAD + p.row * CELL_H;
    pos[name] = { x, y, cx: x + CARD_W/2, cy: y + CARD_H/2 };

    const c = CATS[p.cat].color;
    const card = document.createElement('div');
    card.className = 'card';
    card.style.cssText = `left:${x}px; top:${y}px; --c:${c}`;
    card.dataset.name = name;
    card.innerHTML = `
      <div class="card-bar"><span class="dot"></span>${name}</div>
      <img class="card-shot" loading="lazy" src="./screenshots/${name}.png" alt="${name}">`;
    card.addEventListener('mousedown', e => startCardDrag(e, name));
    card.addEventListener('mouseenter', () => { if (!cardDrag) highlight(name); });
    card.addEventListener('mouseleave', () => { if (!cardDrag) clearHighlight(); });
    world.appendChild(card);
    pos[name].el = card;
  });

  // size svg + world
  let maxX = 0, maxY = 0;
  Object.values(pos).forEach(p => { maxX = Math.max(maxX, p.x + CARD_W); maxY = Math.max(maxY, p.y + CARD_H); });
  const W = maxX + PAD, H = maxY + PAD;
  world.style.width = W + 'px';
  world.style.height = H + 'px';
  svg.setAttribute('width', W);
  svg.setAttribute('height', H);

  // arrow marker
  svg.innerHTML = `
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
      </marker>
      <marker id="arrowHi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#ff6a00"/>
      </marker>
    </defs>`;

  const edgeEls = [];
  EDGES.forEach(([a,b]) => {
    const pa = pos[a], pb = pos[b];
    if (!pa || !pb) return;
    // edge from bottom/side center to target center, trimmed to card border
    const line = document.createElementNS('http://www.w3.org/2000/svg','path');
    line.setAttribute('d', edgePath(pa, pb));
    line.setAttribute('fill','none');
    line.setAttribute('stroke','#94a3b8');
    line.setAttribute('stroke-width','2');
    line.setAttribute('opacity','0.5');
    line.setAttribute('marker-end','url(#arrow)');
    line.dataset.a = a; line.dataset.b = b;
    svg.appendChild(line);
    edgeEls.push(line);
  });

  function updateEdgesFor(name) {
    edgeEls.forEach(l => {
      if (l.dataset.a === name || l.dataset.b === name) {
        l.setAttribute('d', edgePath(pos[l.dataset.a], pos[l.dataset.b]));
      }
    });
  }

  function edgePath(pa, pb) {
    // connect centers but stop at the rectangle edges of each card
    const a = intersect(pa, pb), b = intersect(pb, pa);
    const dx = (b.x - a.x) * 0.4;
    return `M ${a.x} ${a.y} C ${a.x+dx} ${a.y}, ${b.x-dx} ${b.y}, ${b.x} ${b.y}`;
  }
  function intersect(from, to) {
    // point on border of `from` card rectangle toward `to` center
    const cx = from.cx, cy = from.cy;
    const hw = CARD_W/2, hh = CARD_H/2;
    let dx = to.cx - cx, dy = to.cy - cy;
    if (dx === 0 && dy === 0) return { x: cx, y: cy };
    const sx = hw / Math.abs(dx), sy = hh / Math.abs(dy);
    const s = Math.min(sx, sy);
    return { x: cx + dx*s, y: cy + dy*s };
  }

  // pan & zoom
  let scale = 0.85, tx = 0, ty = 0;
  function apply() { world.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`; }

  function fitAll() {
    const vw = viewport.clientWidth, vh = viewport.clientHeight;
    const s = Math.min(vw / W, vh / H) * 0.92;
    scale = Math.max(0.2, Math.min(1.2, s));
    tx = (vw - W*scale)/2;
    ty = (vh - H*scale)/2;
    apply();
  }
  function resetView() { fitAll(); }

  // ---- individual card dragging ----
  let cardDrag = null; // { name, sx, sy, ox, oy, moved }
  function startCardDrag(e, name) {
    e.stopPropagation();              // don't start a background pan
    const p = pos[name];
    cardDrag = { name, sx: e.clientX, sy: e.clientY, ox: p.x, oy: p.y, moved: false };
    p.el.style.zIndex = 20;
    p.el.style.cursor = 'grabbing';
  }

  // ---- background pan ----
  let dragging = false, sx0=0, sy0=0, tx0=0, ty0=0;
  viewport.addEventListener('mousedown', e => {
    dragging = true; sx0=e.clientX; sy0=e.clientY; tx0=tx; ty0=ty;
    viewport.classList.add('grabbing');
  });

  window.addEventListener('mousemove', e => {
    if (cardDrag) {
      const dx = (e.clientX - cardDrag.sx) / scale;
      const dy = (e.clientY - cardDrag.sy) / scale;
      if (Math.abs(e.clientX-cardDrag.sx)+Math.abs(e.clientY-cardDrag.sy) > 3) cardDrag.moved = true;
      const p = pos[cardDrag.name];
      p.x = cardDrag.ox + dx; p.y = cardDrag.oy + dy;
      p.cx = p.x + CARD_W/2; p.cy = p.y + CARD_H/2;
      p.el.style.left = p.x + 'px'; p.el.style.top = p.y + 'px';
      updateEdgesFor(cardDrag.name);
      return;
    }
    if (!dragging) return;
    // 1:1 pan
    tx = tx0 + (e.clientX - sx0); ty = ty0 + (e.clientY - sy0);
    apply();
  });

  window.addEventListener('mouseup', e => {
    if (cardDrag) {
      const { name, moved } = cardDrag;
      pos[name].el.style.cursor = '';
      pos[name].el.style.zIndex = '';
      cardDrag = null;
      if (!moved) openModal(name);   // a click, not a drag → open
    }
    dragging = false;
    viewport.classList.remove('grabbing');
  });

  // ---- gentle zoom (dampened, trackpad-friendly) ----
  viewport.addEventListener('wheel', e => {
    e.preventDefault();
    const rect = viewport.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const wx = (mx - tx)/scale, wy = (my - ty)/scale;
    // exponential factor with a clamped delta → smooth, never jumpy
    const delta = Math.max(-40, Math.min(40, e.deltaY));
    const factor = Math.exp(-delta * 0.0016);
    scale = Math.max(0.2, Math.min(2.5, scale*factor));
    tx = mx - wx*scale; ty = my - wy*scale;
    apply();
  }, { passive: false });

  // highlight connections
  function highlight(name) {
    const linked = new Set([name]);
    EDGES.forEach(([a,b]) => { if (a===name) linked.add(b); if (b===name) linked.add(a); });
    document.querySelectorAll('.card').forEach(c => {
      c.classList.toggle('dim', !linked.has(c.dataset.name));
      c.classList.toggle('focus', c.dataset.name === name);
    });
    edgeEls.forEach(l => {
      const on = l.dataset.a===name || l.dataset.b===name;
      l.setAttribute('stroke', on ? '#ff6a00' : '#94a3b8');
      l.setAttribute('stroke-width', on ? '3' : '2');
      l.setAttribute('opacity', on ? '1' : '0.18');
      l.setAttribute('marker-end', on ? 'url(#arrowHi)' : 'url(#arrow)');
    });
  }
  function clearHighlight() {
    document.querySelectorAll('.card').forEach(c => c.classList.remove('dim','focus'));
    edgeEls.forEach(l => {
      l.setAttribute('stroke', '#94a3b8'); l.setAttribute('stroke-width','2');
      l.setAttribute('opacity','0.5'); l.setAttribute('marker-end','url(#arrow)');
    });
  }

  // modal
  function openModal(name) {
    const p = PAGES[name], c = CATS[p.cat];
    document.getElementById('modalCard').style.setProperty('--c', c.color);
    document.getElementById('modalImg').src = `./screenshots/${name}.png`;
    document.getElementById('modalTitle').textContent = name;
    document.getElementById('modalCat').textContent = c.label;
    document.getElementById('modalRoute').textContent = p.route;

    const out = EDGES.filter(e=>e[0]===name).map(e=>e[1]);
    const inc = EDGES.filter(e=>e[1]===name).map(e=>e[0]);
    document.getElementById('modalOut').innerHTML =
      `<div class="grp-title">Navigates to →</div>` +
      (out.length ? out.map(t=>`<div class="conn" onclick="openModal('${t}')"><span class="arrow">→</span>${t}</div>`).join('')
                  : `<div style="color:#9ca3af;font-size:13px">None</div>`);
    document.getElementById('modalIn').innerHTML =
      `<div class="grp-title">Reached from</div>` +
      (inc.length ? inc.map(t=>`<div class="conn in" onclick="openModal('${t}')"><span class="arrow">→</span>${t}</div>`).join('')
                  : `<div style="color:#9ca3af;font-size:13px">None</div>`);

    document.getElementById('modal').classList.add('show');
  }
  function closeModal() { document.getElementById('modal').classList.remove('show'); }
  document.getElementById('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
  window.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  // search
  document.getElementById('search').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll('.card').forEach(c => {
      const match = !q || c.dataset.name.toLowerCase().includes(q);
      c.classList.toggle('dim', !match);
    });
  });

  // legend
  const legend = document.getElementById('legend');
  Object.values(CATS).forEach(c => {
    const row = document.createElement('div');
    row.className = 'leg';
    row.innerHTML = `<span style="background:${c.color}"></span>${c.label}`;
    legend.appendChild(row);
  });

  fitAll();
  window.addEventListener('resize', fitAll);
</script>
</body>
</html>
