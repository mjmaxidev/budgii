name: budgii

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.backend
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-budgii} -d $${POSTGRES_DB:-budgii}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: budgii-api:latest
    pull_policy: never
    restart: unless-stopped
    env_file: .env.backend
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./data/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    image: budgii-frontend:latest
    pull_policy: never
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy

  recurring-worker:
    image: budgii-api:latest
    pull_policy: never
    restart: unless-stopped
    env_file: .env.backend
    environment:
      BUDGII_RUN_MIGRATIONS: "false"
    command: ["python", "scripts/run_scheduler.py", "recurring", "--interval-seconds", "3600"]
    depends_on:
      api:
        condition: service_healthy

  push-worker:
    image: budgii-api:latest
    pull_policy: never
    restart: unless-stopped
    profiles: ["push"]
    env_file: .env.backend
    environment:
      BUDGII_RUN_MIGRATIONS: "false"
    command: ["python", "scripts/run_scheduler.py", "push", "--interval-seconds", "300"]
    depends_on:
      api:
        condition: service_healthy
