server {
  listen 8080;
  server_name budgii.com.au www.budgii.com.au;

  root /usr/share/nginx/html/website;
  index index.html;

  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  location /assets/ {
    alias /usr/share/nginx/html/assets/;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}

server {
  listen 8080 default_server;
  server_name app.budgii.com.au;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }
}
