name: budgii-dev

services:
  db:
    image: postgres:16-alpine
    env_file:
      - .env.backend
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budgii -d budgii"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./budgii-api
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    env_file:
      - .env.backend
    volumes:
      - receipt_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  receipt_uploads:
