name: budgii-dev

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: budgii
      POSTGRES_PASSWORD: budgii
      POSTGRES_DB: budgii
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budgii -d budgii"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./budgii-api
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      API_PREFIX: /v1
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:5176,http://127.0.0.1:5173,http://127.0.0.1:5176}
      DATABASE_URL: postgresql+asyncpg://budgii:budgii@db:5432/budgii
      JWT_SECRET: ${JWT_SECRET:-dev-docker-secret-change-me}
      AUTH_RATE_LIMIT_ENABLED: ${AUTH_RATE_LIMIT_ENABLED:-true}
      AUTH_RATE_LIMIT_REQUESTS: ${AUTH_RATE_LIMIT_REQUESTS:-20}
      AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-60}
      INVITE_LINK_BASE: https://budgii.app/join
      AUTH_LINK_BASE: http://localhost:5173
      INVITE_EMAIL_PROVIDER: ${INVITE_EMAIL_PROVIDER:-log}
      INVITE_EMAIL_FROM: ${INVITE_EMAIL_FROM:-}
      INVITE_EMAIL_API_KEY: ${INVITE_EMAIL_API_KEY:-}
      RECEIPT_STORAGE_PATH: /app/uploads
      RECEIPT_OCR_PROVIDER: ${RECEIPT_OCR_PROVIDER:-deterministic}
      RECEIPT_OPENAI_MODEL: ${RECEIPT_OPENAI_MODEL:-gpt-5.5}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      BUDGII_DEV_SEED: "true"
    volumes:
      - receipt_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  receipt_uploads:
